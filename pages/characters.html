<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character Encyclopedia | The Conjuring Archives</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/wiki.css" />
</head>
<body>
  <div data-shell-header></div>
  <main id="main" class="container section">
    <div class="section-head"><div><div class="kicker">Character Encyclopedia</div><h1>Characters & Entities</h1><p>Investigators, families, witnesses, and supernatural forces across The Conjuring Universe. Every profile links to films, locations, and related files.</p></div></div>
    <div class="panel" style="margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <input id="q" class="btn" style="min-width:220px;flex:1" placeholder="Filter by name or trait…" />
      <select id="type" class="btn"><option value="">All types</option><option>Investigator</option><option>Entity</option><option>Demon</option><option>Family</option><option>Ally</option><option>Witness</option><option>Subject</option></select>
    </div>
    <div id="list" class="grid cards-3"></div>
  </main>
  <div data-shell-footer></div>
  <script type="module">
    import { mountShell, pageUrl, escapeHtml } from '../js/wiki-app.js';
    import { WIKI } from '../js/wiki-data.js';
    mountShell({ active:'characters.html', inPages:true });
    const list=document.getElementById('list'), q=document.getElementById('q'), type=document.getElementById('type');
    function render(){
      const term=q.value.toLowerCase().trim();
      let arr=WIKI.characters.filter(c=>!term || c.name.toLowerCase().includes(term) || (c.traits||[]).join(' ').toLowerCase().includes(term) || c.bio.toLowerCase().includes(term));
      if(type.value) arr=arr.filter(c=>c.type===type.value);
      list.innerHTML = arr.map(c=>`<a class="card" href="${pageUrl('character',c.id)}" style="text-decoration:none;color:inherit"><div class="thumb">${escapeHtml(c.type)}</div><div class="card-body"><div class="tag">${(c.movies||[]).length} appearance(s)</div><h3>${escapeHtml(c.name)}</h3><p>${escapeHtml(c.bio.slice(0,140))}…</p></div></a>`).join('') || `<p class="meta">No results.</p>`;
    }
    q.addEventListener('input',render); type.addEventListener('change',render); render();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Haunted Locations | The Conjuring Archives</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/wiki.css" />
</head>
<body>
  <div data-shell-header></div>
  <main id="main" class="container section">
    <div class="section-head"><div><div class="kicker">Haunted Locations Encyclopedia</div><h1>Places of Investigation</h1><p>Every major location, its history in the story, key events, connected characters, and timeline links.</p></div></div>
    <div id="list" class="grid cards-3"></div>
  </main>
  <div data-shell-footer></div>
  <script type="module">
    import { mountShell, pageUrl, escapeHtml } from '../js/wiki-app.js';
    import { WIKI } from '../js/wiki-data.js';
    mountShell({ active:'locations.html', inPages:true });
    document.getElementById('list').innerHTML = WIKI.locations.map(l=>`<a class="card" href="${pageUrl('location',l.id)}" style="text-decoration:none;color:inherit"><div class="thumb"><span class="thumb-label">${escapeHtml(l.place)}</span></div><div class="card-body"><div class="tag">Location</div><h3>${escapeHtml(l.name)}</h3><p>${escapeHtml(l.summary)}</p><p class="meta">${(l.movies||[]).length} connected film(s)</p></div></a>`).join('');
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>THE WARREN FILES — The Conjuring Universe 3D Experience</title>
  <meta name="description" content="An immersive 3D horror experience exploring The Conjuring Universe." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #d4af37; --blood: #6b0000; --bg: #000; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: #e8dcc8; font-family: 'Crimson Text', serif; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .overlay { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    .overlay > * { pointer-events: auto; }
    .center { display: flex; align-items: center; justify-content: center; text-align: center; }
    .title { font-family: 'Cinzel', serif; letter-spacing: 0.18em; color: var(--gold); text-shadow: 0 0 24px rgba(212,175,55,.25); }
    .btn {
      font-family: 'Cinzel', serif; letter-spacing: .12em; color: var(--gold); background: rgba(0,0,0,.55);
      border: 1px solid rgba(212,175,55,.45); padding: .85rem 1.2rem; cursor: pointer; text-transform: uppercase;
      backdrop-filter: blur(4px);
    }
    .btn:hover { border-color: var(--gold); box-shadow: 0 0 18px rgba(212,175,55,.18); }
    .btn.secondary { color: #d8c9b0; border-color: rgba(216,201,176,.35); }
    #gate { position: fixed; inset: 0; background: #000; z-index: 30; padding: 24px; }
    #gate .panel { max-width: 720px; margin: auto; border: 1px solid rgba(212,175,55,.25); padding: 28px; background: radial-gradient(ellipse at top, rgba(40,10,10,.35), rgba(0,0,0,.92)); }
    #gate h1 { margin: 0 0 .5rem; font-size: clamp(1.4rem, 4vw, 2.4rem); }
    #gate p { margin: .5rem 0; color: #cbb89a; line-height: 1.6; font-size: 1.05rem; }
    .row { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.25rem; justify-content: center; }
    .warn { color: #ff8a8a; font-size: .95rem; margin-top: .75rem; }
    #hud { position: fixed; left: 12px; bottom: 12px; z-index: 20; display: none; gap: 8px; flex-wrap: wrap; max-width: calc(100% - 24px); }
    #hud .btn { padding: .55rem .75rem; font-size: .72rem; }
    #message { position: fixed; inset: 0; z-index: 25; display: none; background: rgba(0,0,0,.88); }
    #message .inner { max-width: 900px; padding: 24px; }
    #message h2 { font-family: 'Cinzel', serif; color: var(--gold); font-size: clamp(1.2rem, 4vw, 2.2rem); margin: 0 0 .75rem; letter-spacing: .14em; }
    #crosshair { position: fixed; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border: 1px solid rgba(212,175,55,.55); border-radius: 50%; z-index: 15; display: none; opacity: .7; }
    #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 12; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(0,0,0,.55) 100%); mix-blend-mode: multiply; }
    #flash { position: fixed; inset: 0; pointer-events: none; z-index: 26; background: #fff; opacity: 0; }
    @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="vignette"></div>
  <div id="flash"></div>
  <div id="crosshair"></div>

  <div id="gate" class="overlay center">
    <div class="panel">
      <h1 class="title">THE WARREN FILES</h1>
      <p>An interactive 3D horror experience set in The Conjuring Universe. Best experienced with headphones. Desktop recommended for first-person exploration.</p>
      <p class="warn">Content warning: sudden visual/audio horror effects. You can skip the intro jump scare or disable intense effects.</p>
      <div class="row">
        <button class="btn" id="enterBtn">Enter Experience</button>
        <button class="btn secondary" id="skipIntroBtn">Skip Intro</button>
        <button class="btn secondary" id="safeBtn">Low-Intensity Mode</button>
      </div>
      <div class="row">
        <label style="font-family:Cinzel,serif;font-size:.75rem;letter-spacing:.08em;color:#cbb89a;display:flex;gap:.5rem;align-items:center;">
          <input type="checkbox" id="reducedFx"> Reduce motion & flashes
        </label>
      </div>
    </div>
  </div>

  <div id="message" class="overlay center">
    <div class="inner">
      <h2 id="messageTitle"></h2>
      <p id="messageBody" style="color:#d8c9b0;font-size:1.15rem;line-height:1.7;"></p>
      <div class="row"><button class="btn" id="messageClose">Continue</button></div>
    </div>
  </div>

  <div id="hud" class="overlay">
    <button class="btn" id="hudMuseum">Museum</button>
    <button class="btn" id="hudCharacters">Characters</button>
    <button class="btn" id="hudMovies">Movie Worlds</button>
    <button class="btn" id="hudReplay">Replay Intro</button>
    <button class="btn" id="hudSettings">Settings</button>
  </div>

  <script type="module" src="./js/experience.js"></script>
</body>
</html>
